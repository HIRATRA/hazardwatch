# Render Blueprint for the ingestion worker. The web app runs on Vercel.
# See docs/deployment.md for the whole setup, and ADR 0010 for why the
# worker runs as a free web service.
services:
  - type: web
    name: hazardwatch-worker
    runtime: node
    # Free web services sleep after 15 minutes without inbound requests. An
    # uptime monitor calling /health every 5 minutes keeps the worker awake.
    plan: free
    # Next to the Neon database and the Vercel functions, in US East.
    region: virginia
    # Corepack installs the pnpm version pinned in package.json. Dev
    # dependencies, such as TypeScript, are needed to build even though
    # NODE_ENV is production. Free services have no pre-deploy step, so new
    # migrations are applied at the end of the build, once per deploy.
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm turbo run build --filter=@hazardwatch/worker &&
      node packages/db/dist/migrate.js
    startCommand: node apps/worker/dist/index.js
    # Render sets PORT, which turns on the worker's health endpoint.
    healthCheckPath: /health
    # Deploy only commits whose CI checks passed.
    autoDeployTrigger: checksPass
    # Changes to the web app alone do not redeploy the worker.
    buildFilter:
      paths:
        - apps/worker/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - .nvmrc
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Neon's direct connection string, without -pooler in the host: the
      # worker keeps its connections open and the migrations need a session.
      - key: DATABASE_URL
        sync: false
      # Public URL of the web app on Vercel, for the links in alert emails.
      - key: APP_URL
        sync: false
      # Leave SMTP_URL empty to run without email. Free services cannot
      # reach ports 465 and 587: use a provider port such as Resend's 2465.
      - key: SMTP_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Leave the VAPID keys empty to run without push notifications. The
      # public key is the one the web app has.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
