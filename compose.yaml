services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: hazardwatch
      POSTGRES_PASSWORD: hazardwatch
      POSTGRES_DB: hazardwatch
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hazardwatch -d hazardwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
