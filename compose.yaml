services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: hazardwatch
      POSTGRES_PASSWORD: hazardwatch
      POSTGRES_DB: hazardwatch
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hazardwatch -d hazardwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email sent in development. Read them at http://localhost:8025.
  mail:
    image: axllent/mailpit:v1.28
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  db-data:
